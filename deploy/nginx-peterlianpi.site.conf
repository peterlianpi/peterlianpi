# Cloudflare IP ranges
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/12;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
real_ip_header CF-Connecting-IP;

# Static portfolio site
server {
    listen 80;
    server_name peterlianpi.site www.peterlianpi.site;

    root /var/www/peterlianpi.site;
    index index.html;
    charset utf-8;

    location /api/chat/ {
        proxy_pass https://pcore-chatgpt.peterlianpi.site/api/chat/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name pcore-chatgpt.peterlianpi.site;
        proxy_set_header Host pcore-chatgpt.peterlianpi.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portfolio-Visitor $http_x_portfolio_visitor;
        proxy_set_header X-Portfolio-Source $http_x_portfolio_source;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Authorization "Bearer __PORTFOLIO_CHAT_API_KEY__";
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
